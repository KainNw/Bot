name: Build Windows panel

on:
  workflow_dispatch:
  push:
    branches:
      - codex/panel-caza

permissions:
  contents: read

jobs:
  windows-panel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - name: Install locked dependencies
        run: uv sync --frozen --group build --python 3.12
      - name: Run tests, including native Windows self-test
        run: uv run --frozen --group build pytest -q --junitxml=build/pytest.xml
      - name: Report test failures
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build/pytest.xml) {
            [xml]$testReport = Get-Content build/pytest.xml -Raw
            foreach ($problem in $testReport.SelectNodes('//failure|//error')) {
              $failureTail = $problem.InnerText
              if ($failureTail.Length -gt 3500) {
                $failureTail = $failureTail.Substring($failureTail.Length - 3500)
              }
              $failureText = $failureTail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows test failure::$failureText"
            }
          }
      - name: Check code
        run: uv run --frozen --group build ruff check .
      - name: Check formatting
        run: uv run --frozen --group build ruff format --check .
      - name: Build 32-bit client bridge
        run: |
          function Run-NativeBuildStep([string[]]$stepArguments) {
            $messages = & $stepArguments[0] $stepArguments[1..($stepArguments.Length - 1)] 2>&1
            $stepCode = $LASTEXITCODE
            $messages | ForEach-Object { Write-Output $_ }
            if ($stepCode -ne 0) {
              $failureTail = ($messages | Select-Object -Last 60) -join "`n"
              if ($failureTail.Length -gt 10000) {
                $failureTail = $failureTail.Substring($failureTail.Length - 10000)
              }
              $failureText = $failureTail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Native bridge build::$failureText"
              exit $stepCode
            }
          }
          $vsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsInstallation = & $vsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstallation)) {
            Write-Output '::error title=Native bridge build::No x86 MSVC toolchain was found.'
            exit 1
          }
          $vsDevCommand = Join-Path $vsInstallation 'Common7/Tools/VsDevCmd.bat'
          @"
          @echo off
          call "$vsDevCommand" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cmake -S native -B build/native -G "Ninja Multi-Config"
          if errorlevel 1 exit /b %errorlevel%
          cmake --build build/native --config Release
          if errorlevel 1 exit /b %errorlevel%
          ctest --test-dir build/native -C Release --output-on-failure
          exit /b %errorlevel%
          "@ | Set-Content build-native.cmd -Encoding ascii
          Run-NativeBuildStep @('cmd', '/d', '/c', 'build-native.cmd')
      - name: Verify defense and pass parsing on a non-game process
        shell: pwsh
        run: |
          $stanceProbe = Get-Process -Id $PID
          foreach ($stanceOperation in @('--battle-defend', '--battle-pass')) {
            $stanceArguments = @(
              $stanceOperation, '--pid', "$PID", '--created', "$($stanceProbe.StartTime.ToFileTimeUtc())",
              '--window', '1', '--thread', '1', '--slot', '1', '--kind', '209',
              '--serial', '8888', '--unique', '0', '--battle-manager', '65536',
              '--battle-context', '65536', '--battle-client', '65536',
              '--turn-number', '0', '--turn-tick', '1', '--mercenary', '1', '--enemy-member', '1',
              '--source-unit', '65536', '--target-unit', '65536',
              '--actor-kind', '209', '--actor-serial', '8888', '--actor-unique', '0'
            )
            & build/native/Release/AtlanticaBridge.exe @stanceArguments
            if ($LASTEXITCODE -ne 4) {
              throw "Stance parser returned $LASTEXITCODE; expected process/build rejection 4."
            }
          }
          exit 0
      - name: Verify speed command parsing on a non-game process
        shell: pwsh
        run: |
          $probeInstance = Get-Process -Id $PID
          foreach ($probeOperation in @('--speed-apply', '--speed-restore')) {
            $probeArguments = @(
              $probeOperation, '--pid', "$PID", '--created', "$($probeInstance.StartTime.ToFileTimeUtc())",
              '--window', '1', '--thread', '1', '--speed-table', '65536',
              '--speed-player', '65536', '--speed-original-bits', '1068708659',
              '--speed-requested-bits', '1069128090', '--battle-manager', '65536',
              '--battle-context', '65536', '--turn-number', '0', '--turn-tick', '1',
              '--actor-kind', '1', '--actor-serial', '1', '--actor-unique', '0'
            )
            foreach ($probeContext in 0..1) {
              foreach ($probeField in 0..3) {
                $probeArguments += @("--speed-root$probeContext-$probeField", '65536')
              }
            }
            & build/native/Release/AtlanticaBridge.exe @probeArguments
            if ($LASTEXITCODE -ne 4) {
              throw "Speed parser returned $LASTEXITCODE; expected process/build rejection 4."
            }
          }
          exit 0
      - name: Verify panel clock command parsing on a non-game process
        shell: pwsh
        run: |
          $probeInstance = Get-Process -Id $PID
          foreach ($probeOperation in @('--clock-start', '--clock-stop', '--clock-status', '--clock-general-start')) {
            $probeArguments = @(
              $probeOperation, '--pid', "$PID", '--created', "$($probeInstance.StartTime.ToFileTimeUtc())",
              '--window', '1', '--thread', '1', '--clock-owner-pid', "$PID",
              '--clock-owner-created', "$($probeInstance.StartTime.ToFileTimeUtc())",
              '--clock-rate-bits', '1077936128'
            )
            & build/native/Release/AtlanticaBridge.exe @probeArguments
            if ($LASTEXITCODE -ne 4) {
              throw "Clock parser returned $LASTEXITCODE; expected process/build rejection 4."
            }
          }
          exit 0
      - name: Verify Auto Life parsing on a non-game process
        shell: pwsh
        run: |
          $lifeProbe = Get-Process -Id $PID
          & build/native/Release/AtlanticaBridge.exe --auto-life --pid "$PID" --created "$($lifeProbe.StartTime.ToFileTimeUtc())" --window 1 --thread 1 --life-player 65536 --life-info 65536 --life-key 9 --life-threshold 50 --actor-kind 209 --actor-serial 8888 --actor-unique 0
          if ($LASTEXITCODE -ne 4) {
            throw "Auto Life parser returned $LASTEXITCODE; expected process/build rejection 4."
          }
          exit 0
      - name: Build executable
        run: >-
          uv run --frozen --group build pyinstaller
          --noconfirm --clean --onefile --windowed --noupx
          --name AtlanticaPanel --paths src
          --collect-binaries capstone
          --add-binary "build/native/Release/AtlanticaBridge.exe;native"
          --add-binary "build/native/Release/AtlanticaHook.dll;native" panel_caza.py
      - name: Verify executable opens and closes its GUI
        shell: pwsh
        run: |
          $panelProbe = Start-Process -FilePath dist/AtlanticaPanel.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $panelProbe.WaitForExit(30000)) {
            $panelProbe.Kill()
            throw 'The panel did not complete its startup check.'
          }
          if ($panelProbe.ExitCode -ne 0) {
            throw "The panel exited with code $($panelProbe.ExitCode)."
          }
      - name: Write checksum
        shell: pwsh
        run: |
          $panelDigest = Get-FileHash -LiteralPath dist/AtlanticaPanel.exe -Algorithm SHA256
          "$($panelDigest.Hash)  AtlanticaPanel.exe" | Set-Content dist/SHA256.txt -Encoding ascii
      - name: Package separate Cheat Engine timer trial
        run: uv run --frozen --group build python tools/package_ce_speed.py
      - name: Include native library license
        shell: pwsh
        run: Copy-Item native/third_party/minhook/LICENSE.txt dist/THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AtlanticaPanel-Windows
          path: |
            dist/AtlanticaPanel.exe
            dist/SHA256.txt
            dist/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Atlantica-SpeedTrial-CE
          path: dist/Atlantica-SpeedTrial-CE/*
          if-no-files-found: error
          retention-days: 14
