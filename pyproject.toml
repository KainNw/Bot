[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "atlantica-bot"
version = "0.8.2"
description = "Caza de mobs cercanos y control por ventana para Atlantica Online en Windows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
atlantica-bot = "atlantica_bot.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
build = ["pyinstaller>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/atlantica_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
